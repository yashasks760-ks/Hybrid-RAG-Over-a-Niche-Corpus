services:
  - type: web
    name: college-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: DOCUMENT_STORAGE_DIR
        value: data/documents
      - key: QDRANT_STORAGE_DIR
        value: data/qdrant_storage
